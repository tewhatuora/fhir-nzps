<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc">
<title id="title">NZPS profile architecture</title>
<desc id="desc">The NZPS Bundle and Composition profiles derive from FHIR R4 Bundle and Composition, respectively. Other NZPS resource profiles derive from the applicable NZ Base profile or a FHIR R4 base if none exists. Each NZPS profile with an IPS counterpart declares compliance with that profile using compliesWithProfile.</desc>
<defs>
  <marker id="base" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#375B72"/></marker>
  <marker id="ips" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#804665"/></marker>
</defs>
<style>
text { font-family: Arial, "Liberation Sans", sans-serif; }
.code { font-family: "DejaVu Sans Mono", Consolas, monospace; }
</style>
<rect width="1100" height="450" fill="#FFFFFF"/>
<text x="32" y="54" font-size="35" font-weight="700" fill="#152935" text-anchor="start">NZPS profile architecture</text>
<rect x="390" y="86" width="320" height="332" rx="18" fill="#E6F4F1" stroke="#A8CFC8" stroke-width="1.4"/>
<text x="32" y="121" font-size="23" font-weight="700" fill="#375B72" text-anchor="start">Derives from</text>
<text x="32" y="145" font-size="16" font-weight="400" fill="#375B72" text-anchor="start" class="code">baseDefinition</text>
<text x="550" y="127" font-size="24" font-weight="700" fill="#005B55" text-anchor="middle">NZ Patient Summary</text>
<text x="778" y="121" font-size="23" font-weight="700" fill="#804665" text-anchor="start">Complies with</text>
<text x="778" y="145" font-size="16" font-weight="400" fill="#804665" text-anchor="start" class="code">compliesWithProfile</text>
<path d="M 421 197 H 322" fill="none" stroke="#375B72" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#base)"/>
<path d="M 679 197 H 778" fill="none" stroke="#804665" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#ips)"/>
<rect x="32" y="163" width="290" height="68" rx="10" fill="#F3F6F8" stroke="#BCCBD4" stroke-width="1.4"/>
<text x="51" y="204.48" font-size="22" font-weight="700" fill="#284656" text-anchor="start">FHIR R4 Bundle</text>
<rect x="421" y="163" width="258" height="68" rx="10" fill="#00665F" stroke="#00665F" stroke-width="1.4"/>
<text x="550.0" y="204.48" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bundle</text>
<rect x="778" y="163" width="290" height="68" rx="10" fill="#F8EEF4" stroke="#CCA7BB" stroke-width="1.4"/>
<text x="797" y="204.48" font-size="22" font-weight="700" fill="#713553" text-anchor="start">Bundle (IPS)</text>
<path d="M 421 280 H 322" fill="none" stroke="#375B72" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#base)"/>
<path d="M 679 280 H 778" fill="none" stroke="#804665" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#ips)"/>
<rect x="32" y="246" width="290" height="68" rx="10" fill="#F3F6F8" stroke="#BCCBD4" stroke-width="1.4"/>
<text x="51" y="287.48" font-size="22" font-weight="700" fill="#284656" text-anchor="start">FHIR R4 Composition</text>
<rect x="421" y="246" width="258" height="68" rx="10" fill="#00665F" stroke="#00665F" stroke-width="1.4"/>
<text x="550.0" y="287.48" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Composition</text>
<rect x="778" y="246" width="290" height="68" rx="10" fill="#F8EEF4" stroke="#CCA7BB" stroke-width="1.4"/>
<text x="797" y="287.48" font-size="22" font-weight="700" fill="#713553" text-anchor="start">Composition (IPS)</text>
<path d="M 421 363 H 322" fill="none" stroke="#375B72" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#base)"/>
<path d="M 679 363 H 778" fill="none" stroke="#804665" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#ips)"/>
<rect x="32" y="329" width="290" height="68" rx="10" fill="#E8F2FA" stroke="#8BB3CE" stroke-width="1.4"/>
<text x="51" y="361.14" font-size="21" font-weight="700" fill="#174B70" text-anchor="start">NZ Base resource profile</text>
<text x="51" y="383.14" font-size="16" font-weight="400" fill="#174B70" text-anchor="start">FHIR R4 base if none exists</text>
<rect x="421" y="329" width="258" height="68" rx="10" fill="#00665F" stroke="#00665F" stroke-width="1.4"/>
<text x="550.0" y="369.8" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Other resource profiles</text>
<rect x="778" y="329" width="290" height="68" rx="10" fill="#F8EEF4" stroke="#CCA7BB" stroke-width="1.4"/>
<text x="797" y="361.14" font-size="21" font-weight="700" fill="#713553" text-anchor="start">IPS resource profile</text>
<text x="797" y="383.14" font-size="16" font-weight="400" fill="#713553" text-anchor="start">Where a counterpart exists</text>
</svg>
