<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="391" viewBox="0 0 1100 391" role="img" aria-labelledby="title desc">
<title id="title">NZPS Bundle profile</title>
<desc id="desc">NZPS Bundle derives from FHIR R4 Bundle. Bundle (IPS) derives from FHIR R4 Bundle. NZPS Bundle declares compliance with Bundle (IPS) using compliesWithProfile and incorporates IPS and New Zealand patient summary requirements.</desc>
